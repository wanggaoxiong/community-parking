<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="邻里寻位" />
  <meta name="theme-color" content="#F2F4F7" />
  <meta name="parking-mobile-version" content="dev" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>邻里寻位 · 实时车位平面图</title>
  <link rel="stylesheet" href="/mobile.css" />
</head>
<body>
  <div class="mobile-shell">
    <!-- 顶部极简状态栏 -->
    <header class="m-topbar">
      <div class="m-brand">
        <span class="live-dot" id="liveDot" aria-hidden="true"></span>
        <h1 class="m-title" id="communityName">邻里公益寻位</h1>
        <span class="m-live-tag" id="liveTagText">实时</span>
      </div>
      <div class="m-net-pill" id="totalFreePill">
        <span class="m-net-prefix">净余</span>
        <strong id="totalFreeNum">--</strong>
        <span class="m-net-unit">位</span>
      </div>
    </header>

    <!-- 场所身份验证条（仅当前小区/办公区开启了专属身份口令且未验证时显示） -->
    <section class="m-auth-card" id="mobileAuthCard" hidden aria-label="场所身份口令验证">
      <div class="m-auth-title" id="mobileAuthTitle">请输入本场所访问口令</div>
      <div class="m-auth-row">
        <input id="mobileTokenInput" type="password" class="m-auth-input" placeholder="输入身份口令（本机自动记忆）" autocomplete="off" />
        <button type="button" id="btnSaveMobileToken" class="m-speak-btn">进入</button>
      </div>
    </section>

    <!-- 一体化苹果风寻位控制台（目的地 + 极简播报偏好 + 实时导引摘要） -->
    <section class="m-deck-card" aria-label="寻位导航与语音播报">
      <div class="m-controls-card" aria-label="目的地与语音播报设置">
        <div class="m-dest-row">
          <div class="m-select-wrap">
            <span class="m-field-prefix" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 14.2s4.8-4.1 4.8-7.7a4.8 4.8 0 1 0-9.6 0c0 3.6 4.8 7.7 4.8 7.7Z"/>
                <circle cx="8" cy="6.5" r="1.6"/>
              </svg>
              <label class="m-dest-label" for="mobileUnitSelect">前往</label>
            </span>
            <select id="mobileUnitSelect" class="m-unit-select" aria-label="选择回家目的地楼栋单元"></select>
            <span class="m-select-chevron" aria-hidden="true">
              <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 4.5 6 7.5 9 4.5"/>
              </svg>
            </span>
          </div>

          <button
            type="button"
            id="btnEvModeToggle"
            class="m-ev-mode-btn"
            hidden
            aria-pressed="false"
            title="开启新能源寻桩优先模式（优先推荐空闲充电桩车位）"
          >
            <span class="m-ev-bolt" aria-hidden="true">⚡</span>
            <span id="evModeLabel">寻桩</span>
          </button>

          <button type="button" id="btnSpeakAction" class="m-speak-btn" aria-live="polite">
            <svg class="m-icon-svg" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 6.2h2.3L8.2 3.4v9.2L4.8 9.8H2.5a.7.7 0 0 1-.7-.7V6.9c0-.4.3-.7.7-.7Z"/>
              <path d="M10.8 5.5a3.6 3.6 0 0 1 0 5"/>
              <path d="M12.8 3.7a6.2 6.2 0 0 1 0 8.6"/>
            </svg>
            <span>播报</span>
          </button>
        </div>

        <div class="m-broadcast-row">
          <div class="m-seg-group" id="repeatModeGroup" role="radiogroup" aria-label="播报遍数">
            <button type="button" class="m-seg-btn" data-repeat="1" role="radio" aria-checked="false">1 遍</button>
            <button type="button" class="m-seg-btn is-active" data-repeat="2" role="radio" aria-checked="true">2 遍</button>
          </div>

          <div class="m-voice-select-wrap" title="选择播报音色（默认采用系统本地极速语音）">
            <span class="m-voice-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round">
                <path d="M3 6.5v3M6.3 4.2v7.6M9.7 5.4v5.2M13 6.8v2.4"/>
              </svg>
            </span>
            <select id="mobileVoiceSelect" class="m-voice-select" aria-label="选择语音播报音色">
              <option value="">默认音色</option>
            </select>
            <span class="m-voice-chevron" aria-hidden="true">
              <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 4.5 6 7.5 9 4.5"/>
              </svg>
            </span>
          </div>

          <button
            type="button"
            id="btnContinuousToggle"
            class="m-continuous-pill is-on"
            aria-pressed="true"
            title="开启后车位变化自动语音播报；关闭后仅点按「播报」时发声"
          >
            <span class="m-cont-dot" aria-hidden="true"></span>
            <span id="continuousLabel">自动播报</span>
          </button>
        </div>
      </div>

      <!-- 带标签特色车位实时空余速查条（当小区标有新能源/招租/宽体/无障碍等车位时自动展示） -->
      <div id="mobileTagFilterBar" class="m-tag-filter-bar" hidden role="region" aria-label="特色标签车位空余筛选"></div>

      <!-- 实时推荐精简摘要条 -->
      <div class="m-guidance-strip" id="guidanceCard" aria-live="polite">
        <div class="m-guide-main">
          <div class="m-guide-primary">
            <span class="m-rec-tag" id="recBadgeTag">首选推荐</span>
            <span class="m-rec-zone" id="recZoneName">正在同步实时车位…</span>
          </div>
          <div class="m-guide-metrics" id="recMetricsWrap">
            <span class="m-metric-free" id="recFreePill">--</span>
            <span class="m-metric-walk" id="recWalkPill">--m</span>
          </div>
        </div>
        <div class="m-guide-sub">
          <span class="m-backup-line" id="recBackupText">点选目的地或轻触平面图楼栋即可切换寻位</span>
          <span class="m-voice-state" id="voiceStatusBadge">自动播报已开启</span>
        </div>
      </div>

      <!-- 社区车主福利 / 满位导引轻量展位（无在投计划时彻底隐藏，零空间占用） -->
      <div id="mobileAdSlot" class="m-ad-slot" hidden role="region" aria-label="社区车主服务推荐"></div>
    </section>

    <!-- 实时态势平面图画布（支持单指平移、双指捏合缩放、点楼栋切目的地） -->
    <main class="m-map-stage" id="mobileMapStage">
      <svg
        id="mobileMapSvg"
        class="m-map-svg"
        viewBox="0 0 145 100"
        preserveAspectRatio="xMidYMid meet"
        aria-label="小区车位实时态势平面图"
      ></svg>

      <!-- 地图右上角 Apple Maps 风格毛玻璃悬浮工具组 -->
      <div class="m-map-tools">
        <div class="m-zoom-stepper" role="group" aria-label="地图缩放">
          <button type="button" id="btnZoomIn" class="m-tool-btn" aria-label="放大平面图">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>
          </button>
          <button type="button" id="btnZoomOut" class="m-tool-btn" aria-label="缩小平面图">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 8h9"/></svg>
          </button>
        </div>
        <button type="button" id="btnZoomReset" class="m-tool-btn m-tool-pill" hidden aria-label="重置地图视野">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.2 8a4.8 4.8 0 1 1 1.2 3.2"/><path d="M3 4.6v3.2h3.2"/>
          </svg>
          <span>归位</span>
        </button>
        <button type="button" id="btnBackdropToggle" class="m-tool-btn m-tool-pill" hidden aria-label="切换底图叠显">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="8 2.2 14 5.4 8 8.6 2 5.4 8 2.2"/>
            <path d="m2 8.6 6 3.2 6-3.2"/>
            <path d="m2 11.6 6 3.2 6-3.2"/>
          </svg>
          <span>底图</span>
        </button>
      </div>

      <!-- 轻触车位/停车带时的浮动微提示 -->
      <div class="m-map-toast" id="mapSpotToast" hidden></div>

      <!-- 轻触 ⚡新能源 / 🤝对外招租 车位时的 Apple Maps 浮动详情卡 -->
      <div class="m-spot-sheet" id="mobileSpotSheet" hidden role="dialog" aria-label="车位标签与共享招租详情">
        <div class="m-ss-head">
          <div class="m-ss-titles">
            <span class="m-ss-zone" id="mobSheetZone">小区车位</span>
            <div class="m-ss-title-row">
              <strong id="mobSheetTitle">01号位</strong>
              <span class="m-ss-status" id="mobSheetStatus">空闲可停</span>
            </div>
          </div>
          <button type="button" id="btnCloseMobSpotSheet" class="m-ss-close" aria-label="关闭详情">✕</button>
        </div>
        <div class="m-ss-tags" id="mobSheetTags"></div>
        <div class="m-ss-details" id="mobSheetDetails"></div>
      </div>

      <!-- 社区合作商户领券 / 预约 / 导航 Apple Wallet 风格浮层 -->
      <div class="m-spot-sheet m-ad-sheet" id="mobileAdSheet" hidden role="dialog" aria-label="车主专享权益详情">
        <div class="m-ss-head">
          <div class="m-ss-titles">
            <span class="m-ss-zone" id="mobAdSheetAdv">社区合作商户</span>
            <div class="m-ss-title-row">
              <strong id="mobAdSheetTitle">车主专享礼遇</strong>
              <span class="m-ss-status" id="mobAdSheetOffer" hidden>特惠</span>
            </div>
          </div>
          <button type="button" id="btnCloseMobAdSheet" class="m-ss-close" aria-label="关闭权益详情">✕</button>
        </div>
        <p class="m-ad-sheet-sub" id="mobAdSheetSub"></p>
        <div id="mobAdSheetBody" class="m-ad-sheet-body"></div>
      </div>

      <!-- 底部悬浮胶囊图例 -->
      <footer class="m-map-legend" aria-label="图例说明">
        <span class="lg-item"><i class="lg-dot lg-free"></i>空闲</span>
        <span class="lg-item"><i class="lg-dot lg-occ"></i>已停</span>
        <span class="lg-item"><i class="lg-dot lg-blk"></i>禁停</span>
        <span class="lg-item" id="mobLegendEv" hidden><i class="lg-ev-bolt">⚡</i>充电</span>
        <span class="lg-item" id="mobLegendRent" hidden><i class="lg-dot lg-rent"></i>招租</span>
        <span class="lg-sep" aria-hidden="true"></span>
        <span class="lg-item"><i class="lg-line lg-walk"></i>步行</span>
        <span class="lg-item"><i class="lg-line lg-drive"></i>行车</span>
      </footer>
    </main>
  </div>

  <script src="/mobile.js"></script>
</body>
</html>
