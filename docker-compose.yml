# ==============================================================================
# 邻里停 (Community Parking) 容器化与 Spot 实例抗抢占编排 (Docker Compose v2)
#
# 1) 仅启动核心服务 (本地 Mac / Windows 物业机 / Ubuntu 云端 / Spot 实例):
#      docker compose up -d --build
#
# 2) 连同免费 Cloudflare Tunnel 一键打通公网 HTTPS (免公网IP、免备案、0元服务1000+车主):
#      CLOUDFLARE_TUNNEL_TOKEN=你的隧道Token docker compose --profile tunnel up -d --build
#
# 3) 零入站端口无人值守模式 (GitHub CI 门禁 -> GHCR -> Watchtower 自动热更 + 健康失败自动回滚):
#      ./parking-ctl.sh docker-autoupdate
# ==============================================================================

services:
  community-parking:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PARKING_IMAGE:-ghcr.io/wanggaoxiong/community-parking:latest}
    container_name: community-parking
    restart: always
    stop_grace_period: 25s
    labels:
      com.centurylinklabs.watchtower.enable: "${WATCHTOWER_ENABLE:-true}"
    environment:
      - TZ=Asia/Shanghai
      - PUBLIC_MOBILE_URL=${PUBLIC_MOBILE_URL:-}
      - PUBLIC_VOICE_URL=${PUBLIC_VOICE_URL:-}
      - VOICE_GATEWAY_TOKEN=${VOICE_GATEWAY_TOKEN:-}
      - VOICE_ICLOUD_SHORTCUT_URL=${VOICE_ICLOUD_SHORTCUT_URL:-}
    ports:
      # 管理控制台默认仅暴露给宿主机回环口 (127.0.0.1:8790)，防止公网误扫管理端；
      # 如需局域网其他电脑管理，可设环境变量 PARKING_ADMIN_BIND=0.0.0.0
      - "${PARKING_ADMIN_BIND:-127.0.0.1}:${PARKING_PORT:-8790}:8790"
      # :18790 极简手机看图与播报端（只读无管理接口）
      - "${PARKING_MOBILE_PORT:-18790}:18790"
      # :18791 Siri CarPlay 免手语音 / 自有大模型问答 / 普通微信 ClawBot 网关
      - "${PARKING_VOICE_PORT:-18791}:18791"
      # :2121 局域网摄像头 FTP 内存接收口
      - "${PARKING_FTP_PORT:-2121}:2121"
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 可选侧车 1: Cloudflare Zero Trust 免费出站隧道 (--profile tunnel 启用)
  # 在 Cloudflare Zero Trust 后台将:
  #   parking.你的域名.com -> http://community-parking:18790  (微信浮窗看图+播报)
  #   voice.你的域名.com   -> http://community-parking:18791  (Siri 车载免手唤醒+AI问答)
  #   admin.你的域名.com   -> http://community-parking:8790   (配合 Cloudflare Access 邮箱验证码锁)
  #   ssh.你的域名.com     -> ssh://host.docker.internal:22   (配合云防火墙彻底关闭公网 22 端口)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: community-parking-tunnel
    profiles: ["tunnel"]
    restart: always
    depends_on:
      - community-parking
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # 可选侧车 2: Watchtower 无人值守镜像拉取热更 (--profile autoupdate 启用)
  # 采用维护分支 nickfedor/watchtower 原生兼容 Ubuntu 24.04 Docker Engine API 1.44+；
  # 严格开启 WATCHTOWER_LABEL_ENABLE=true，仅热更主业务容器，绝不中断 cloudflared 隧道与回滚守卫。
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: community-parking-watchtower
    profiles: ["autoupdate"]
    restart: always
    depends_on:
      - community-parking
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      - TZ=Asia/Shanghai
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=false
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      - WATCHTOWER_TIMEOUT=25s
      - WATCHTOWER_INCLUDE_RESTARTING=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # 可选侧车 3: 健康失败自动回滚与防死循环守卫 (--profile autoupdate 启用)
  # 持续巡检主容器三端口 HEALTHCHECK：健康时自动锚定 community-parking:last-known-good，
  # 若新版本启动异常或健康检查失败，秒级自动回退至上一健康版本并临时冻结坏镜像防循环拉取，
  # 待上游 GHCR 发布新修复版本后自动恢复升级。
  rollback-guard:
    image: ${PARKING_IMAGE:-ghcr.io/wanggaoxiong/community-parking:latest}
    container_name: community-parking-rollback-guard
    profiles: ["autoupdate"]
    restart: always
    depends_on:
      - community-parking
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    command: ["python", "-m", "app.rollback_guard"]
    environment:
      - TZ=Asia/Shanghai
      - PARKING_IMAGE=${PARKING_IMAGE:-ghcr.io/wanggaoxiong/community-parking:latest}
      - ROLLBACK_TARGET_CONTAINER=community-parking
      - ROLLBACK_CHECK_INTERVAL=${ROLLBACK_CHECK_INTERVAL:-15}
      - ROLLBACK_STARTUP_GRACE=${ROLLBACK_STARTUP_GRACE:-75}
      - ROLLBACK_UPSTREAM_PROBE_INTERVAL=${ROLLBACK_UPSTREAM_PROBE_INTERVAL:-300}
    healthcheck:
      test: ["CMD", "python", "-c", "import os; assert os.path.exists('/var/run/docker.sock')"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
